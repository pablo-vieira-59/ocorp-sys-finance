<div class="row mt-0 mx-0 bg-white shadow top-bar">
  <div class="col-lg-8 col-6 d-flex m-0">
    <h2 class="my-auto">Dashboard</h2>
  </div>
  <!-- <div class="col-lg-4 col-6 text-end">
        <button (click)="showAddModal = true;" class="w-100 btn btn-primary">+ Adicionar Renda</button>
    </div> -->
</div>

<div class="p-4" style="margin-top: 100px;">
  <div class="row">

    <div class="col-lg-3 col-6 p-2 ">
      <div class="border rounded-4 p-4 bg-white stretch hoverble" routerLink="/income">
        <label class="col-12 fw-bold fs-7 f-muted">Renda mensal</label>
        <label class="col-12 fs-4 fw-bold text-success">{{patrimony.totalIncome | currency:'BRL' }}</label>
      </div>
    </div>

    <div class="col-lg-3 col-6 p-2 ">
      <div class="border rounded-4 p-4 bg-white stretch hoverble" routerLink="/expenses">
        <label class="col-12 fw-bold fs-7 f-muted text-nowrap">Despesas mensais</label>
        <label class="col-12 fs-4 fw-bold text-danger">{{patrimony.totalExpenses | currency:'BRL' }}</label>
      </div>
    </div>

    <div class="col-lg-3 col-12 p-2 ">
      <div class="border rounded-4 p-4 bg-white stretch hoverble" routerLink="/assets">
        <label class="col-12 fw-bold fs-7 f-muted">Patrimônio</label>
        <label class="col-12 fs-4 fw-bold text-primary">{{patrimony.overallTotal | currency:'BRL' }}</label>
      </div>
    </div>

    <div class="col-lg-3 col-12 p-2 ">
      <div class="border rounded-4 p-4 bg-white stretch hoverble" routerLink="/investments">
        <label class="col-12 fw-bold fs-7 f-muted">Investimentos</label>
        <label class="col-12 fs-4 fw-bold text-warning">{{ patrimony.totalInvestments | currency:'BRL' }}</label>
      </div>
    </div>

  </div>

  <div class="row">
    <div class="col-lg-12 col-12 p-2 ">
      <div class="border rounded-4 p-4 bg-white stretch hoverble" routerLink="/assets">
        <label class="col-12 fw-bold fs-7 f-muted">Histórico de patrimônio</label>

        <div *ngIf="patrimony.assetHistories.length > 0">
          <apx-chart *ngIf="assetHistoryChartOptions" [series]="assetHistoryChartOptions.series"
            [chart]="assetHistoryChartOptions.chart" [xaxis]="assetHistoryChartOptions.xaxis"
            [yaxis]="assetHistoryChartOptions.yaxis" [plotOptions]="assetHistoryChartOptions.plotOptions"
            [dataLabels]="assetHistoryChartOptions.dataLabels" [grid]="assetHistoryChartOptions.grid"
            [tooltip]="assetHistoryChartOptions.tooltip" [legend]="assetHistoryChartOptions.legend"
            [theme]="assetHistoryChartOptions.theme">
          </apx-chart>
        </div>

        <div *ngIf="patrimony.assetHistories.length <= 0">
          <div class="mt-4 alert alert-info">
            Adicione um historico para visualizar.
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-lg-6 col-12 p-2">
      <div class="border rounded-4 p-4 bg-white stretch hoverble" routerLink="/assets">
        <label class="col-12 fw-bold fs-7 f-muted">Distribuição do patrimonio</label>

        <div *ngIf="patrimony.assets.length > 0">
          <apx-chart class="mx-auto" *ngIf="assetTypeChartOptions" [series]="assetTypeChartOptions.series"
            [chart]="assetTypeChartOptions.chart" [labels]="assetTypeChartOptions.labels"
            [responsive]="assetTypeChartOptions.responsive" [theme]="assetTypeChartOptions.theme">
          </apx-chart>
        </div>

        <div *ngIf="patrimony.assets.length <= 0">
          <div class="mt-4 alert alert-info">
            Adicione um patrimonio para visualizar.
          </div>
        </div>
      </div>
    </div>

    <div class="col-lg-6 col-12 p-2">
      <div class="border rounded-4 p-4 bg-white stretch hoverble">
        <label class="col-12 fw-bold fs-7 f-muted">Resumo Orçamentário</label>

        <div class="d-flex flex-column stretch">
          <div class="my-auto">
            <div class="row">
              <div class="col-6">
                <label class="col-12 fs-7">Orçamento mensal</label>
                <label class="col-12 fw-bold fs-5 ">{{patrimony.totalIncome | currency:'BRL'}}</label>
              </div>
              <div class="col-6">
                <label class="col-12 fs-7">Utilizado</label>
                <label class="col-12 fw-bold fs-5 text-danger">{{patrimony.totalExpenses | currency:'BRL'}}</label>
              </div>
            </div>

            <div class="row mt-4 mx-0">
              <div class="p-0 progress" role="progressbar" aria-label="Example" aria-valuenow="50" aria-valuemin="0"
                aria-valuemax="100" style="height: 20px">
                <div class="progress-bar bg-danger" [style]="getExpensesBarSize()"></div>
              </div>
            </div>

            <div class="row mt-4">
              <label class="col-12 fs-7">Disponivel</label>
              <label class="col-12 fw-bold fs-5 text-success ">{{patrimony.totalIncome - patrimony.totalExpenses|
                currency:'BRL'}}</label>
            </div>
          </div>

        </div>

      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-lg-6 col-12 p-2">
      <div class="border rounded-4 p-4 bg-white stretch hoverble" routerLink="/investments">
        <label class="col-12 fw-bold fs-7 f-muted">Distribuição do investimentos</label>

        <div *ngIf="patrimony.investments.length > 0">
          <apx-chart class="mx-auto" *ngIf="investmentTypeChartOptions" [series]="investmentTypeChartOptions.series"
            [chart]="investmentTypeChartOptions.chart" [labels]="investmentTypeChartOptions.labels"
            [responsive]="investmentTypeChartOptions.responsive" [theme]="investmentTypeChartOptions.theme">
          </apx-chart>
        </div>

        <div *ngIf="patrimony.investments.length <= 0">
          <div class="mt-4 alert alert-info">
            Adicione um investimento para visualizar.
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
